# =============================================================================
# Terraform Apply ワークフロー
# mainブランチへのpush時にterraform applyを自動実行する
# terraform/**配下のファイル変更時のみトリガー
# =============================================================================
name: Terraform Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"

# OIDC認証に必要な権限設定（アクセスキー不要）
permissions:
  id-token: write  # OIDCトークンの発行に必要
  contents: read   # リポジトリのチェックアウトに必要

env:
  TF_VERSION: "1.6.0"
  WORKING_DIR: terraform/environments/dev

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    steps:
      # ソースコードのチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # OIDC認証でAWSにアクセス（アクセスキー不使用）
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      # Terraformのセットアップ
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # 初期化（バックエンドとプロバイダーのセットアップ）
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      # Apply実行（承認不要で自動適用）
      # ⚠️ mainブランチへのマージ前に必ずPRでplan内容を確認すること
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false
        working-directory: ${{ env.WORKING_DIR }}
