# ============================================================
# ansible-playbook-ai-reviewer: Terraform + Lambda デプロイワークフロー
#
# 注記:
#   GitHub Actions はリポジトリ直下の .github/workflows/ しか読まないため、
#   モノレポのこのワークフローはルートに置き、paths / working-directory は
#   すべて ansible-playbook-ai-reviewer/ プレフィックス付きで指定している。
#   (旧: ansible-playbook-ai-reviewer/.github/workflows/deploy.yml は無効だった)
#
# 動作:
#   PR                      : terraform plan を実行し、結果を PR コメントに投稿
#   main への push / 手動実行 : Lambda をパッケージングしてデプロイ（terraform apply はしない）
#
# Secrets:
#   AWS_ROLE_ARN : OIDC で AssumeRole する IAM ロールの ARN
#                  (ansible-playbook-ai-reviewer/terraform/bootstrap の role_arn 出力)
# ============================================================

name: ansible-ai-reviewer Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "ansible-playbook-ai-reviewer/terraform/**"
      - "ansible-playbook-ai-reviewer/lambda/**"
      - ".github/workflows/ansible-ai-reviewer-deploy.yml"
  push:
    branches: [main]
    paths:
      - "ansible-playbook-ai-reviewer/terraform/**"
      - "ansible-playbook-ai-reviewer/lambda/**"
  workflow_dispatch:

permissions:
  id-token: write      # OIDC認証に必要
  contents: read
  pull-requests: write  # Terraform planコメント投稿に必要

env:
  TF_VERSION: '1.10.x'  # S3 backend の use_lockfile に 1.10 以上が必要
  PYTHON_VERSION: '3.12'
  AWS_REGION: 'ap-northeast-1'
  PROJECT_DIR: 'ansible-playbook-ai-reviewer'
  WORKING_DIR: 'ansible-playbook-ai-reviewer/terraform/environments/dev'

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        # defaults.run では env コンテキストが使えないためリテラルで指定する
        working-directory: ansible-playbook-ai-reviewer/terraform/environments/dev

    steps:
      - uses: actions/checkout@v4

      - name: AWS認証 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraformセットアップ
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.PROJECT_DIR }}/terraform

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color -out=tfplan
        continue-on-error: true  # planが失敗してもコメント投稿は行う

      - name: Terraform PlanをPRにコメント投稿
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### Terraform Plan結果 (ansible-ai-reviewer) 🔍

            **ステータス**: ${{ steps.plan.outcome == 'success' && '✅ 成功' || '❌ 失敗' }}

            <details><summary>Plan詳細を表示</summary>

            \`\`\`terraform
            ${{ steps.plan.outputs.stdout }}
            \`\`\`

            </details>

            *実行者: @${{ github.actor }}, ワークフロー: \`${{ github.workflow }}\`*`;

            // 既存の同種コメントを検索して更新（重複防止）
            // モノレポ内の他プロジェクトのコメントと混ざらないよう識別子を含める
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Terraform Plan結果 (ansible-ai-reviewer)')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: output,
              });
            }

            // planが失敗した場合はジョブを失敗させる
            if ('${{ steps.plan.outcome }}' === 'failure') {
              core.setFailed('Terraform planが失敗しました');
            }

      # terraform apply はこのワークフローでは実行しない。
      # インフラ変更は「apply はユーザー自身が実行する」運用ポリシーに従い、手元で行う。

  deploy-lambda:
    name: Deploy Lambda
    runs-on: ubuntu-latest
    needs: terraform
    # main への push、または main ブランチでの手動実行（workflow_dispatch）でのみデプロイする
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    steps:
      - uses: actions/checkout@v4

      - name: AWS認証 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 依存関係インストール & パッケージング
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          # arm64向けにmanylinux2014_aarch64バイナリをインストール
          pip install -r lambda/playbook_reviewer/requirements.txt \
            -t lambda/playbook_reviewer/ \
            --platform manylinux2014_aarch64 \
            --only-binary=:all:

          cd lambda/playbook_reviewer
          zip -r ../../lambda_package.zip .

      - name: Lambdaへデプロイ
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          aws lambda update-function-code \
            --function-name ansible-ai-reviewer \
            --zip-file fileb://lambda_package.zip

          aws lambda wait function-updated \
            --function-name ansible-ai-reviewer

          aws lambda publish-version \
            --function-name ansible-ai-reviewer

      - name: デプロイ完了通知
        run: |
          VERSION=$(aws lambda list-versions-by-function \
            --function-name ansible-ai-reviewer \
            --query 'Versions[-1].Version' \
            --output text)
          echo "Lambda デプロイ完了: version $VERSION"
