name: Golden AMI Build

on:
  workflow_dispatch:
    inputs:
      eks_version:
        description: "EKS version (e.g. 1.30)"
        required: true
        default: "1.30"
        type: string
      dry_run:
        description: "Validate only; do not build an AMI"
        required: false
        default: false
        type: boolean

  push:
    branches: [main]
    paths:
      - "eks-golden-node-pipeline/ansible/**"
      - "eks-golden-node-pipeline/packer/**"
      - ".github/workflows/ami-build.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  PACKER_VERSION: "1.10.3"
  PROJECT_DIR: eks-golden-node-pipeline

jobs:
  validate:
    name: Validate Packer template
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Set up Ansible
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "ansible-core==2.15.13"
          echo "${{ github.workspace }}/${{ env.PROJECT_DIR }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Initialize Packer plugins
        working-directory: ${{ env.PROJECT_DIR }}/packer
        run: packer init golden-ami.pkr.hcl

      - name: Validate Packer template
        working-directory: ${{ env.PROJECT_DIR }}/packer
        run: |
          packer validate \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "eks_version=${{ inputs.eks_version || '1.30' }}" \
            golden-ami.pkr.hcl

      - name: Check Ansible syntax
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          ansible-playbook \
            --syntax-check \
            -i ansible/inventory/packer_hosts \
            ansible/playbooks/golden-ami.yml

  build:
    name: Build Golden AMI
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ github.event_name == 'push' || inputs.dry_run != true }}

    environment: production

    outputs:
      ami_id: ${{ steps.ami.outputs.ami_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/eks-golden-node-pipeline-github-actions-role
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-AMIBuild-${{ github.run_id }}

      - name: Set up Packer
        uses: hashicorp/setup-packer@v3
        with:
          version: ${{ env.PACKER_VERSION }}

      - name: Set up Ansible
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "ansible-core==2.15.13"
          echo "${{ github.workspace }}/${{ env.PROJECT_DIR }}/.venv/bin" >> "$GITHUB_PATH"

      - name: Initialize Packer plugins
        working-directory: ${{ env.PROJECT_DIR }}/packer
        run: packer init golden-ami.pkr.hcl

      - name: Build Golden AMI
        working-directory: ${{ env.PROJECT_DIR }}/packer
        run: |
          packer build \
            -var "aws_region=${{ env.AWS_REGION }}" \
            -var "eks_version=${{ inputs.eks_version || '1.30' }}" \
            golden-ami.pkr.hcl
        env:
          PACKER_LOG: "1"

      - name: Get AMI ID
        id: ami
        working-directory: ${{ env.PROJECT_DIR }}/packer
        run: |
          AMI_ID=$(jq -r '.builds[-1].artifact_id' packer-manifest.json | cut -d: -f2)
          echo "ami_id=${AMI_ID}" >> "$GITHUB_OUTPUT"

      - name: Write build summary
        run: |
          {
            echo "## Golden AMI Build Result"
            echo ""
            echo "| Key | Value |"
            echo "|---|---|"
            echo "| AMI ID | ${{ steps.ami.outputs.ami_id }} |"
            echo "| EKS Version | ${{ inputs.eks_version || '1.30' }} |"
            echo "| Region | ${{ env.AWS_REGION }} |"
          } >> "$GITHUB_STEP_SUMMARY"