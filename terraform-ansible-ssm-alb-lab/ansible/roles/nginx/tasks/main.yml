- name: Install nginx
  yum:
    name: nginx
    state: present
  tags: [install]

- name: Deploy nginx.conf
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    mode: "0644"
  notify: restart nginx
  tags: [config]

- name: Enable & start nginx
  service:
    name: nginx
    enabled: true
    state: started
  tags: [service]
