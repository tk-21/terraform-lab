apiVersion: karpenter.k8s.aws/v1beta1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2
  role: karpenter-node-ept-dev  # placeholder — real value injected by Terraform/Helm
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ept-dev  # must match cluster name tag
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ept-dev
  tags:
    Project: eks-performance-tuning
    ManagedBy: karpenter
