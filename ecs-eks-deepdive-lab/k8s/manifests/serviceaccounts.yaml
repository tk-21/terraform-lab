# API Server ServiceAccount
# Pod Identity Association は Terraform 側で設定済み
# OIDC IRSA と違い annotations は不要（Pod Identity Agent が自動的に処理）
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-server
  namespace: deepdive
---
# Job Worker ServiceAccount
# Pod Identity Association は Terraform 側で設定済み
apiVersion: v1
kind: ServiceAccount
metadata:
  name: job-worker
  namespace: deepdive
