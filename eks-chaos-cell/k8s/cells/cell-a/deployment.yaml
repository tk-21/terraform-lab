# =============================================================
# Cell-A ワークロード
# サンプルアプリ: nginx + ヘルスチェックエンドポイント
#
# 設計ポイント:
# - nodeSelector + tolerations でCell-Aノードに固定
# - topologySpreadConstraints でPodをノード間に分散
# - readinessProbe・livenessProbe でALBヘルスチェック対応
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: cell-a
  labels:
    app: app
    cell: cell-a
spec:
  replicas: 4
  selector:
    matchLabels:
      app: app
      cell: cell-a
  template:
    metadata:
      labels:
        app: app
        cell: cell-a
    spec:
      # Cell-AのKarpenterノードに配置
      nodeSelector:
        cell: cell-a
      tolerations:
        - key: cell
          value: cell-a
          effect: NoSchedule

      # Podをノード間に均等分散（1ノードに集中しない）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: app
              cell: cell-a

      # グレースフルシャットダウン時間（ALBのドレイン待ち）
      terminationGracePeriodSeconds: 60

      containers:
        - name: app
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http

          # 起動時にCell識別ファイルを作成
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    mkdir -p /usr/share/nginx/html
                    printf '<!DOCTYPE html>\n<html>\n<body>\n  <h1>Cell-A Response</h1>\n  <p>Pod: %s</p>\n</body>\n</html>\n' "${HOSTNAME}" > /usr/share/nginx/html/index.html
                    echo "OK" > /usr/share/nginx/html/healthz

          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: app
                    cell: cell-a
                topologyKey: kubernetes.io/hostname
