apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: cell-b
  labels:
    app: app
    cell: cell-b
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: |
      deregistration_delay.timeout_seconds=30
spec:
  selector:
    app: app
    cell: cell-b
  ports:
    - name: http
      port: 80
      targetPort: 80
  type: ClusterIP
