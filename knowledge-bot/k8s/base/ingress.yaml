apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knowledgebot
  namespace: knowledgebot
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip

    # 必要に応じて ALB の OIDC 認証を有効化する場合の例
    # 現在は internal ALB のみを使用し、この設定は無効
    # alb.ingress.kubernetes.io/auth-type: oidc
    # alb.ingress.kubernetes.io/auth-scope: "openid"
    # alb.ingress.kubernetes.io/auth-session-timeout: "3600"
    # alb.ingress.kubernetes.io/auth-on-unauthenticated-request: authenticate
    # alb.ingress.kubernetes.io/auth-idp-oidc: >
    #   {"issuer":"REPLACE_ISSUER",
    #    "authorizationEndpoint":"REPLACE_AUTHZ",
    #    "tokenEndpoint":"REPLACE_TOKEN",
    #    "userInfoEndpoint":"REPLACE_USERINFO",
    #    "secretName":"oidc-client-secret"}

    # ALB Access Logs（deploy scriptでbucket埋め）
    # alb.ingress.kubernetes.io/load-balancer-attributes: >
    #   access_logs.s3.enabled=true,access_logs.s3.bucket=YOUR_BUCKET,access_logs.s3.prefix=knowledgebot

spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: knowledgebot
                port:
                  number: 80
