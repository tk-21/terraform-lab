name: 'Ansible Playbook AI Reviewer'
description: 'Amazon Bedrockを使ってAnsible PlaybookのAIレビューをPRコメントに投稿する'
author: 'infra-team'

inputs:
  api_endpoint:
    description: 'Reviewer APIのエンドポイントURL（terraform output の api_endpoint。/review を含む完全URL）'
    required: true
  api_key:
    description: 'API GatewayのAPIキー（x-api-key ヘッダーで送信）'
    required: true
  api_secret:
    description: '追加認証シークレット（リクエストbodyの api_secret で送信し、Lambda が SSM の値と照合）'
    required: true
  github_token:
    description: 'GitHubトークン（変更ファイル一覧の取得用。PRコメント投稿は Lambda が SSM のトークンで行う）'
    required: true
    default: ${{ github.token }}
  playbook_paths:
    description: 'レビュー対象PlaybookのGlobパターン（カンマ区切り）'
    required: false
    default: '**/*.yml,**/*.yaml'
  fail_on_critical:
    description: 'CRITICALな問題が検出された場合にワークフローを失敗させるか'
    required: false
    default: 'true'

outputs:
  review_status:
    description: 'レビュー結果ステータス (passed/failed/error)'
    value: ${{ steps.review.outputs.review_status }}
  issues_found:
    description: '検出された問題の総数'
    value: ${{ steps.review.outputs.issues_found }}
  overall_score:
    description: '総合スコア (0-100)'
    value: ${{ steps.review.outputs.overall_score }}

runs:
  using: 'composite'
  steps:
    - name: 変更されたPlaybookファイルを取得
      id: get-changed-files
      shell: bash
      run: |
        # PRで変更されたファイルをgh CLIで取得し、Globパターンでフィルタリング
        CHANGED_FILES=$(gh pr view "$PR_NUMBER" \
          --repo "$REPO_OWNER/$REPO_NAME" \
          --json files \
          --jq '.files[].path')

        # カンマ区切りのGlobパターンを配列に変換
        IFS=',' read -ra PATTERNS <<< "$PLAYBOOK_PATHS"

        MATCHED_FILES=""
        while IFS= read -r file; do
          for pattern in "${PATTERNS[@]}"; do
            # bashのパターンマッチングでGlobフィルタリング
            if [[ "$file" == $pattern ]]; then
              MATCHED_FILES="${MATCHED_FILES}${file}"$'\n'
              break
            fi
          done
        done <<< "$CHANGED_FILES"

        # 改行区切りをスペース区切りに変換してOUTPUTへ
        MATCHED_FILES_ONELINE=$(echo "$MATCHED_FILES" | tr '\n' ' ' | sed 's/ $//')
        echo "changed_playbooks=$MATCHED_FILES_ONELINE" >> "$GITHUB_OUTPUT"

        if [ -z "$MATCHED_FILES_ONELINE" ]; then
          echo "レビュー対象のPlaybookファイルが見つかりませんでした"
        else
          echo "対象ファイル: $MATCHED_FILES_ONELINE"
        fi
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        PLAYBOOK_PATHS: ${{ inputs.playbook_paths }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}

    - name: 各Playbookをレビュー
      id: review
      shell: bash
      run: |
        if [ -z "$CHANGED_PLAYBOOKS" ]; then
          {
            echo "review_status=passed"
            echo "issues_found=0"
            echo "overall_score=100"
          } >> "$GITHUB_OUTPUT"
          echo "対象Playbookなし。レビューをスキップします。"
          exit 0
        fi

        TOTAL_ISSUES=0
        TOTAL_SCORE=0
        FILE_COUNT=0
        HAS_CRITICAL=false
        REVIEW_FAILED=false

        for playbook_file in $CHANGED_PLAYBOOKS; do
          echo "レビュー中: $playbook_file"

          # ファイルが存在しない場合はスキップ（削除されたファイルなど）
          if [ ! -f "$playbook_file" ]; then
            echo "ファイルが見つかりません。スキップ: $playbook_file"
            continue
          fi

          # Lambda の仕様に合わせたJSONを jq で組み立てる
          #   - playbook_content は生のYAML文字列（base64しない）
          #   - フィールド名は index.py の _REQUIRED_FIELDS に一致させる
          #   - api_secret は body に含める（Lambda が SSM の値と照合する）
          #   - jq で組み立てるため、YAML内の引用符や改行でJSONが壊れない
          PAYLOAD=$(jq -n \
            --rawfile content "$playbook_file" \
            --arg filename "$playbook_file" \
            --arg owner "$REPO_OWNER" \
            --arg repo "$REPO_NAME" \
            --argjson pr "$PR_NUMBER" \
            --arg secret "$API_SECRET" \
            '{
              playbook_content: $content,
              playbook_filename: $filename,
              github_repo_owner: $owner,
              github_repo_name: $repo,
              pr_number: $pr,
              api_secret: $secret
            }')

          # api_endpoint は /review を含む完全URL。bodyは stdin で渡し、
          # secret をプロセス引数に出さない
          RESPONSE=$(printf '%s' "$PAYLOAD" | curl -s -w "\n%{http_code}" \
            -X POST "$API_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $API_KEY" \
            -d @- \
            --max-time 120)

          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "APIエラー (HTTP $HTTP_STATUS): $playbook_file"
            echo "レスポンス: $BODY"
            REVIEW_FAILED=true
            continue
          fi

          # レスポンス: overall_score / risk_level / issues_count / critical_count
          SCORE=$(echo "$BODY" | jq -r '.overall_score // 0')
          ISSUES=$(echo "$BODY" | jq -r '.issues_count // 0')
          CRITICAL_COUNT=$(echo "$BODY" | jq -r '.critical_count // 0')
          RISK_LEVEL=$(echo "$BODY" | jq -r '.risk_level // "UNKNOWN"')

          echo "  スコア: $SCORE/100, 問題数: $ISSUES, リスク: $RISK_LEVEL"

          TOTAL_SCORE=$((TOTAL_SCORE + SCORE))
          TOTAL_ISSUES=$((TOTAL_ISSUES + ISSUES))
          FILE_COUNT=$((FILE_COUNT + 1))

          # CRITICALチェック
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            HAS_CRITICAL=true
            echo "  !! CRITICAL問題が $CRITICAL_COUNT 件検出されました"
          fi
        done

        # 平均スコア計算
        if [ "$FILE_COUNT" -gt 0 ]; then
          AVG_SCORE=$((TOTAL_SCORE / FILE_COUNT))
        else
          AVG_SCORE=100
        fi

        # ステータス決定
        if [ "$REVIEW_FAILED" = true ]; then
          STATUS="error"
        elif [ "$HAS_CRITICAL" = true ] && [ "$FAIL_ON_CRITICAL" = "true" ]; then
          STATUS="failed"
        else
          STATUS="passed"
        fi

        {
          echo "review_status=$STATUS"
          echo "issues_found=$TOTAL_ISSUES"
          echo "overall_score=$AVG_SCORE"
        } >> "$GITHUB_OUTPUT"

        echo "=== レビュー完了 ==="
        echo "ステータス: $STATUS"
        echo "総問題数: $TOTAL_ISSUES"
        echo "平均スコア: $AVG_SCORE/100"

        # APIエラーがあった場合、または fail_on_critical が true で CRITICAL 検出時は失敗させる
        if [ "$STATUS" = "error" ]; then
          echo "APIエラーがあったためワークフローを失敗させます"
          exit 1
        fi
        if [ "$STATUS" = "failed" ]; then
          echo "CRITICALな問題が検出されたためワークフローを失敗させます"
          exit 1
        fi
      env:
        CHANGED_PLAYBOOKS: ${{ steps.get-changed-files.outputs.changed_playbooks }}
        FAIL_ON_CRITICAL: ${{ inputs.fail_on_critical }}
        API_ENDPOINT: ${{ inputs.api_endpoint }}
        API_KEY: ${{ inputs.api_key }}
        API_SECRET: ${{ inputs.api_secret }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
