name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write   # OIDC トークン取得に必要
  contents: read
  pull-requests: write  # PR へのコメントに必要

env:
  TF_VERSION: "1.9.0"
  TF_WORKING_DIR: environments/dev
  AWS_REGION: ap-northeast-1

jobs:
  terraform:
    name: Terraform ${{ github.event_name == 'push' && 'Apply' || 'Plan' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      # -------------------------------------------------------
      # 1. ソースチェックアウト
      # -------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------
      # 2. AWS 認証 (OIDC — アクセスキー不使用)
      # -------------------------------------------------------
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-Terraform

      # -------------------------------------------------------
      # 3. Terraform セットアップ
      # -------------------------------------------------------
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # -------------------------------------------------------
      # 4. Terraform Init
      # -------------------------------------------------------
      - name: Terraform Init
        id: init
        run: terraform init -input=false

      # -------------------------------------------------------
      # 5. Terraform Format チェック
      # -------------------------------------------------------
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      # -------------------------------------------------------
      # 6. Terraform Validate
      # -------------------------------------------------------
      - name: Terraform Validate
        id: validate
        run: terraform validate

      # -------------------------------------------------------
      # 7. Terraform Plan (PR / push 共通)
      # -------------------------------------------------------
      - name: Terraform Plan
        id: plan
        run: |
          set -euo pipefail
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="owner=github-actions" \
            2>&1 | tee plan_output.txt
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

      # -------------------------------------------------------
      # 8. PR へ Plan 結果をコメント
      # -------------------------------------------------------
      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan_output.txt', 'utf8');

            const truncated = planOutput.length > 60000
              ? planOutput.substring(0, 60000) + '\n\n... (出力が長いため省略されました)'
              : planOutput;

            const body = [
              '## Terraform Plan',
              '',
              '| | ステータス |',
              '|---|---|',
              `| Format | ${{ steps.fmt.outcome == 'success' && '✅ Pass' || '⚠️ Warning' }} |`,
              `| Validate | ${{ steps.validate.outcome == 'success' && '✅ Pass' || '❌ Fail' }} |`,
              `| Plan | ${{ steps.plan.outcome == 'success' && '✅ Success' || '❌ Fail' }} |`,
              '',
              '<details><summary>Plan 詳細</summary>',
              '',
              '```',
              truncated,
              '```',
              '',
              '</details>',
              '',
              `*実行者: \`${{ github.actor }}\` / ワークフロー: \`${{ github.workflow }}\`*`,
            ].join('\n');

            // 既存の Bot コメントを削除して再投稿（重複防止）
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const comment of comments) {
              if (comment.user.type === 'Bot' && comment.body.startsWith('## Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      # -------------------------------------------------------
      # 9. Terraform Apply (main ブランチへの push のみ)
      # -------------------------------------------------------
      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
