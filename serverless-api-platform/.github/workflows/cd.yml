# .github/workflows/cd.yml
#
# CD パイプライン — main ブランチへの push 時に実行される。
# terraform apply → Lambda デプロイ → スモークテスト の順に実行する。
#
# CI パイプライン (ci.yml) が成功した PR のみ main にマージできる設定を
# GitHub の Branch protection rules で行うこと。

name: CD

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - "src/**"

permissions:
  id-token: write
  contents: read

jobs:
  # ============================================================
  # Terraform Apply
  # ============================================================
  deploy-infrastructure:
    name: Terraform Apply (dev)
    runs-on: ubuntu-latest
    environment: dev  # GitHub Environments で承認フローを設定可能

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.7"
          terraform_wrapper: false  # outputs を正確に取得するため

      - name: Terraform Init
        working-directory: terraform/environments/dev
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform/environments/dev
        env:
          TF_VAR_account_id: ${{ secrets.TF_VAR_account_id }}
          TF_VAR_alert_email: ${{ secrets.TF_VAR_alert_email }}
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: terraform/environments/dev
        run: terraform apply -auto-approve tfplan

      - name: Get API endpoint
        id: get-endpoint
        working-directory: terraform/environments/dev
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> $GITHUB_OUTPUT

    outputs:
      api_endpoint: ${{ steps.get-endpoint.outputs.api_endpoint }}

  # ============================================================
  # スモークテスト
  # ============================================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: deploy-infrastructure

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest requests

      - name: Run smoke test
        env:
          API_ENDPOINT: ${{ needs.deploy-infrastructure.outputs.api_endpoint }}
          TEST_USER_ID: smoke-test-user
        run: |
          pytest tests/integration/ -v --timeout=30

      - name: Notify on failure
        if: failure()
        run: |
          echo "スモークテスト失敗: ${{ needs.deploy-infrastructure.outputs.api_endpoint }}"
          # 必要に応じて Slack 通知などを追加する
