kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: idp-lab
nodes:
  - role: control-plane
    image: kindest/node:v1.30.0
    labels:
      ingress-ready: "true"
    extraPortMappings:
      # ArgoCD UI (NodePort 30080 → localhost:30080)
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # HTTPS 用（将来の Ingress 対応）
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
      # Backstage UI (NodePort 30000 → localhost:30000)
      - containerPort: 30000
        hostPort: 30000
        protocol: TCP
  - role: worker
    image: kindest/node:v1.30.0
  - role: worker
    image: kindest/node:v1.30.0
