apiVersion: v1
kind: Service
metadata:
  name: argocd-server-nodeport
  namespace: argocd
  labels:
    app: argocd-server-nodeport
    managed-by: argocd
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: argocd-server
  ports:
    # HTTP のみ公開する（ハンズオン用途のため TLS 終端は不要）
    - name: http
      port: 80
      targetPort: 8080
      nodePort: 30080
