apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-environment
  title: AWS アプリ環境作成
  description: S3 バケットを含む AWS アプリ環境を Crossplane 経由で自動プロビジョニングする
  tags:
    - aws
    - s3
    - crossplane
spec:
  owner: platform-team
  type: environment

  # ─────────────────────────────────────────────
  # フォーム定義: 開発者が Backstage UI で入力する項目
  # ─────────────────────────────────────────────
  parameters:
    - title: アプリケーション情報
      required:
        - appName
        - environment
      properties:
        appName:
          title: アプリ名
          type: string
          description: |
            S3 バケット名 "idp-<appName>-<environment>" の一部になる。
            小文字英数字とハイフンのみ使用可（3〜30文字）。
            他ユーザーと重複しないよう個人名や日付を含めること（例: myapp-takuya）。
          pattern: "^[a-z][a-z0-9-]{2,30}$"
          ui:autofocus: true

        environment:
          title: 環境
          type: string
          description: デプロイ先の環境を選択する
          enum:
            - dev
            - staging
            - prod
          enumNames:
            - 開発環境 (dev)
            - ステージング (staging)
            - 本番 (prod)
          default: dev

        versioning:
          title: S3 バージョニング
          type: boolean
          description: S3 バケットのバージョニングを有効にするか（prod 環境では推奨）
          default: false

        region:
          title: AWSリージョン
          type: string
          description: デプロイ先の AWS リージョン
          default: ap-northeast-1
          enum:
            - ap-northeast-1
            - ap-northeast-3
          enumNames:
            - 東京 (ap-northeast-1)
            - 大阪 (ap-northeast-3)

    - title: Git リポジトリ設定
      required:
        - repoUrl
      properties:
        repoUrl:
          title: リポジトリ
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com

  # ─────────────────────────────────────────────
  # ステップ定義: フォーム送信後の処理
  # ─────────────────────────────────────────────
  steps:
    - id: fetch
      name: Claim YAML を生成
      action: fetch:template
      input:
        # skeleton/ の YAML にフォーム値を埋め込む
        url: ./skeleton
        values:
          appName: ${{ parameters.appName }}
          environment: ${{ parameters.environment }}
          versioning: ${{ parameters.versioning }}
          region: ${{ parameters.region }}

    - id: publish
      name: Git に commit & push
      action: publish:github
      input:
        allowedHosts: ["github.com"]
        description: "Add ${{ parameters.appName }}-${{ parameters.environment }} environment"
        repoUrl: ${{ parameters.repoUrl }}
        # crossplane/claims/ 配下に配置することで ArgoCD が検知する
        targetPath: crossplane/claims
        defaultBranch: main

    - id: register
      name: Backstage Catalog に登録
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
        optional: true

  # ─────────────────────────────────────────────
  # 完了後に表示するリンク
  # ─────────────────────────────────────────────
  output:
    links:
      - title: GitHub で確認
        url: ${{ steps.publish.output.remoteUrl }}
      - title: ArgoCD で同期状態を確認
        url: http://localhost:30080
