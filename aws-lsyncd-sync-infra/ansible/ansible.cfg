# =============================================================
# ansible.cfg — Ansible 基本設定
# 運用者→EC2 の接続は SSM Session Manager 経由。
# ポート22はインターネットに開けない。
# =============================================================

[defaults]
inventory           = inventory/aws_ec2.yml
private_key_file    = keys/ec2_key.pem
remote_user         = ec2-user
host_key_checking   = False
stdout_callback     = yaml
forks               = 5
roles_path          = roles

[privilege_escalation]
become              = True
become_method       = sudo
become_user         = root

[ssh_connection]
# SSM Session Manager をプロキシとして SSH トンネルを確立する。
# %h にはインスタンス ID（i-xxxx）が渡される。
# aws ssm-session-manager-plugin が必要:
#   https://docs.aws.amazon.com/systems-manager/latest/userguide/session-manager-working-with-install-plugin.html
ssh_args            = -o ProxyCommand="aws ssm start-session --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p --region ap-northeast-1" -o ControlMaster=auto -o ControlPersist=60s
pipelining          = True
