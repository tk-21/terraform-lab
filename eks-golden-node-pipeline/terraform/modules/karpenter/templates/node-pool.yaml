# NodePool - ノードプロビジョニングポリシー
# スポットインスタンスを優先し、オンデマンドにフォールバックする

apiVersion: karpenter.sh/v1beta1
kind: NodePool
metadata:
  name: golden-ami-node-pool
spec:
  template:
    metadata:
      labels:
        # ノード識別ラベル
        node-type: golden-ami
        cluster: "${cluster_name}"

    spec:
      # 使用する EC2NodeClass を参照
      nodeClassRef:
        apiVersion: karpenter.k8s.aws/v1beta1
        kind: EC2NodeClass
        name: golden-ami-node-class

      requirements:
        # アーキテクチャ: arm64 優先（Graviton でコスト削減）
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]

        # OS
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]

        # インスタンスカテゴリ: t, m, c 系（汎用〜コンピュート最適化）
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["t", "m", "c"]

        # インスタンスサイズ: medium, large のみ
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: ["medium", "large"]

        # 容量タイプ: Spot 優先、オンデマンドフォールバック
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]

      # ノード有効期限（Golden AMI 更新を強制するため 7 日で入れ替え）
      expireAfter: 168h

  # スケールダウンポリシー
  disruption:
    consolidationPolicy: WhenUnderutilized
    consolidateAfter: 1m

  # ノード上限（コスト管理）
  limits:
    cpu: "32"
    memory: 64Gi
