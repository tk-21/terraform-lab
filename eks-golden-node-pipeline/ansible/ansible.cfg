[defaults]
# インベントリのデフォルトパス
inventory = inventory/packer_hosts
# ロールの検索パス
roles_path = roles
# SSH接続のタイムアウト設定
timeout = 30
# ホストキー検証を無効化（Packer一時インスタンス用）
host_key_checking = False
# 出力をカラー表示
force_color = True
# 冪等性確認のためログを有効化
log_path = /tmp/ansible.log

[ssh_connection]
# SSH多重化で高速化
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
