# NVIDIA Device Plugin: GPUリソース(nvidia.com/gpu)をKubernetesリソースとして公開する
# GPUノードにのみデプロイするためNodeSelectorとtolerationを設定する
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      # GPUノードのtaint(nvidia.com/gpu=true:NoSchedule)を許容する
      # このtolerationがないとDevice Plugin自体がGPUノードにスケジュールできなくなる
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      # system-node-critical: ノード起動直後にDevice Pluginが必ず起動するようにする
      # これがないとGPUリソースが登録される前にvLLM Podが配置されてしまう可能性がある
      priorityClassName: system-node-critical
      containers:
        - name: nvidia-device-plugin-ctr
          image: nvcr.io/nvidia/k8s-device-plugin:v0.14.5
          env:
            - name: FAIL_ON_INIT_ERROR
              # GPUが存在しないノードでDaemonSetが失敗しないようにfalseにする
              # nodeSelector設定と二重の安全策
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
      nodeSelector:
        # KarpenterがGPUノードに自動付与するラベルでフィルタリングする
        # CPUノードへの誤配置を防ぎリソースの無駄遣いをなくす
        karpenter.k8s.aws/instance-gpu-manufacturer: "nvidia"
