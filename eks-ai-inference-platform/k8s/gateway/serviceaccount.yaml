apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-gateway-sa
  namespace: ai-inference
  annotations:
    # IRSA: Pod が AWS SDK を使う際に eks-ai-inf-dev-ai-gateway-sa ロールを引き受ける
    # ロール ARN は `terraform output gateway_irsa_role_arn` で確認する
    eks.amazonaws.com/role-arn: "GATEWAY_IRSA_ROLE_ARN"
automountServiceAccountToken: true
