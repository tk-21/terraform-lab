apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector-sa
  namespace: monitoring
  annotations:
    # IRSAアノテーション: TerraformのoutputをデプロイスクリプトまたはKustomizeで設定する
    # 値は `terraform output -raw otel_collector_irsa_arn` で取得できる
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/eks-ai-inf-dev-otel-collector"
