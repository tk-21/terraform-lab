# DCGM (Data Center GPU Manager) Exporter
# GPUの物理メトリクスをPrometheus形式で公開するDaemonSet
# DaemonSetを選択した理由: GPUメトリクスはノード単位で取得するため
# sidecar方式ではなくノードに1対1で配置するDaemonSetが適切

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-dcgm-exporter
  namespace: monitoring
  labels:
    app: nvidia-dcgm-exporter
spec:
  selector:
    matchLabels:
      app: nvidia-dcgm-exporter
  template:
    metadata:
      labels:
        app: nvidia-dcgm-exporter
      annotations:
        # OTEL CollectorのPrometheus Receiverがこのアノテーションを見てスクレイプ対象を判定する
        prometheus.io/scrape: "true"
        prometheus.io/port: "9400"
    spec:
      tolerations:
        # GPUノードにはtaintが付与されているため、DCGMがスケジュールされるよう許容する
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        # GPUノード (KarpenterがNodePoolで付与するラベル) にのみ配置する
        karpenter.k8s.aws/instance-gpu-manufacturer: "nvidia"
      containers:
        - name: dcgm-exporter
          image: nvcr.io/nvidia/k8s/dcgm-exporter:3.3.5-3.4.0-ubuntu22.04
          securityContext:
            # NVML経由でGPUデバイスにアクセスするためにprivilegedが必要
            privileged: true
          ports:
            - containerPort: 9400
              name: metrics
          env:
            - name: DCGM_EXPORTER_LISTEN
              value: ":9400"
            # KubernetesのPod-GPU対応付け情報をメトリクスのラベルとして付与するため有効化
            - name: DCGM_EXPORTER_KUBERNETES
              value: "true"
            # デフォルトの全メトリクスを収集 (GPU使用率/温度/電力/VRAMが含まれる)
            - name: DCGM_EXPORTER_COLLECTORS
              value: "/etc/dcgm-exporter/dcp-metrics-included.csv"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
          volumeMounts:
            # KubernetesがどのPodにどのGPUを割り当てたかを取得するために必要
            - name: pod-gpu-resources
              readOnly: true
              mountPath: /var/lib/kubelet/pod-resources
      volumes:
        - name: pod-gpu-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
---
apiVersion: v1
kind: Service
metadata:
  name: nvidia-dcgm-exporter
  namespace: monitoring
  labels:
    app: nvidia-dcgm-exporter
spec:
  # ClusterIP: OTEL CollectorがVPC内部からスクレイプするため外部公開は不要
  type: ClusterIP
  selector:
    app: nvidia-dcgm-exporter
  ports:
    - name: metrics
      port: 9400
      targetPort: 9400
