---
- name: Python 3.11 と依存パッケージのインストール
  ansible.builtin.dnf:
    name:
      - python3.11
      - python3.11-pip
    state: present
  register: python_pkg
  changed_when: python_pkg is changed

- name: アプリディレクトリ作成
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0750"
  loop:
    - "{{ app_dir }}"
    - "{{ app_dir }}/logs"
    - "{{ app_dir }}/config"
  register: app_dirs
  changed_when: app_dirs is changed

- name: アプリ設定ファイル配置
  ansible.builtin.template:
    src: app_config.j2
    dest: "{{ app_dir }}/config/app.cfg"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
  register: app_cfg
  changed_when: app_cfg is changed
  notify: アプリ再起動

- name: requirements.txt 配置
  ansible.builtin.copy:
    dest: "{{ app_dir }}/requirements.txt"
    content: |
      flask==3.0.3
      gunicorn==22.0.0
      boto3==1.34.69
      pymysql==1.1.1
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  register: requirements_txt
  changed_when: requirements_txt is changed

- name: pip パッケージインストール (virtualenv)
  ansible.builtin.pip:
    requirements: "{{ app_dir }}/requirements.txt"
    virtualenv: "{{ app_dir }}/venv"
    virtualenv_python: python3.11
  become: true
  become_user: "{{ app_user }}"
  register: pip_install
  changed_when: pip_install is changed
