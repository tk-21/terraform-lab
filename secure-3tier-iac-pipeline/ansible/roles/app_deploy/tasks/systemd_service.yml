---
- name: systemd サービスユニット配置
  ansible.builtin.template:
    src: app_service.j2
    dest: /etc/systemd/system/webapp.service
    owner: root
    group: root
    mode: "0644"
  register: webapp_unit
  changed_when: webapp_unit is changed
  notify:
    - systemd daemon-reload
    - アプリ再起動

- name: webapp サービス有効化
  ansible.builtin.systemd:
    name: webapp
    state: started
    enabled: true
    daemon_reload: true
  register: webapp_svc
  changed_when: webapp_svc is changed
