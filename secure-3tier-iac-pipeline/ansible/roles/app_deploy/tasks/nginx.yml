---
- name: Nginx インストール
  ansible.builtin.dnf:
    name: nginx
    state: present
  register: nginx_pkg
  changed_when: nginx_pkg is changed

- name: Nginx 設定ファイル配置
  ansible.builtin.template:
    src: app.conf.j2
    dest: /etc/nginx/conf.d/app.conf
    owner: root
    group: root
    mode: "0644"
    validate: "nginx -t -c /etc/nginx/nginx.conf"
  register: nginx_conf
  changed_when: nginx_conf is changed
  notify: nginx再起動

- name: Nginx サービス有効化
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true
  register: nginx_svc
  changed_when: nginx_svc is changed
