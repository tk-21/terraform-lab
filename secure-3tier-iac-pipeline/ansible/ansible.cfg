[defaults]
inventory          = inventories/aws_ec2.yml
remote_user        = ec2-user
# [注意] aws_ssm 接続は ssm-user で入るため /home/ec2-user 配下に一時ディレクトリを作れない。/tmp 配下を使う
remote_tmp         = /tmp/.ansible/tmp
private_key_file   =
# [設計意図] Vault パスワードファイルを既定にし、ansible-inventory --list などでも復号できるようにする
# [注意] ファイルはリポジトリ外 (~/.vault_pass) に置き、権限は 600 にすること
vault_password_file = ~/.vault_pass
host_key_checking  = False
# [注意] yaml コールバックは新しい ansible-core で廃止されたため、default + result_format で YAML 出力にする
stdout_callback    = default
result_format      = yaml
callbacks_enabled  = timer, profile_tasks
retry_files_enabled = False

[ssh_connection]
ssh_executable = /usr/bin/ssh

[privilege_escalation]
become      = True
become_method = sudo
become_user = root
