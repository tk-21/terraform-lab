name: terraform plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
  push:
    branches: ["main"]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC 用（推奨）
  contents: read

env:
  TF_VERSION: "1.7.5"
  TF_WORKDIR: "terraform/envs/dev"
  AWS_REGION: "ap-northeast-1"
  TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

jobs:
  plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # ---- AWS認証（推奨: OIDC）----
      # 事前にAWS側で GitHub OIDC + IAM Role を作っておく必要あり
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      # ---- もし OIDC がまだなら、アクセスキー方式に切り替えたい場合 ----
      # 上の OIDC step をコメントアウトして、下を有効化してください
      #
      # - name: Configure AWS credentials (Access Keys)
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: ${{ env.AWS_REGION }}

      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      # backend.tf をまだ入れてない（= local state）段階では backend=false が安全
      - name: Terraform init (no backend)
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform init -backend=false

      - name: Terraform validate
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform validate

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKDIR }}
        run: terraform plan -no-color
