apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: frontend-external
  namespace: mesh-apps
  # Ingress Gateway 経由の外部トラフィック用 VirtualService
  # hosts に "*" を使用するのは Ingress Gateway スコープに限定されるため安全
spec:
  hosts:
    - "*"
  gateways:
    - mesh-apps-gateway  # 外部トラフィックのみ（mesh gateway は含めない）
  http:
    # カナリアリリース: v2 に 20% のトラフィックを流す
    # 段階的に weight を変更して安全にロールアウトする
    - route:
        - destination:
            host: frontend
            subset: v1
          weight: 80
        - destination:
            host: frontend
            subset: v2
          weight: 20
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s
        # ゲートウェイエラー・接続失敗・リトライ可能な 4xx でリトライ
        retryOn: gateway-error,connect-failure,retriable-4xx
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: frontend-internal
  namespace: mesh-apps
  # クラスタ内部サービス間通信用 VirtualService
spec:
  hosts:
    - frontend  # Kubernetes Service FQDN の短縮形（mesh gateway スコープ）
  gateways:
    - mesh  # クラスタ内部通信のみ
  http:
    - route:
        - destination:
            host: frontend
            subset: v1
          weight: 80
        - destination:
            host: frontend
            subset: v2
          weight: 20
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure,retriable-4xx
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: backend
  namespace: mesh-apps
spec:
  hosts:
    - backend
  gateways:
    - mesh
  http:
    - route:
        - destination:
            host: backend
            subset: v1
          weight: 100
      timeout: 10s
      retries:
        attempts: 3
        perTryTimeout: 3s
        retryOn: gateway-error,connect-failure,retriable-4xx
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: database-stub
  namespace: mesh-apps
spec:
  hosts:
    - database-stub
  gateways:
    - mesh
  http:
    - route:
        - destination:
            host: database-stub
            subset: v1
          weight: 100
      timeout: 10s
